<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Unban Appeal</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            text-align: center;
            color: #00bcd4;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #b0b0b0;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            background-color: #2c2c2c;
            border: 1px solid #444;
            border-radius: 4px;
            color: #fff;
            box-sizing: border-box;
        }
        textarea {
            resize: vertical;
            height: 80px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #00bcd4;
            border: none;
            border-radius: 4px;
            color: #121212;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #008ba3;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Ban Appeal Portal</h2>
    <form action="https://formspree.io/f/https://formspree.io/f/mgaeojda" method="POST">
        <label for="username">Minecraft Username</label>
        <input type="text" id="username" name="username" required placeholder="YourIGN">

        <label for="reason">Ban Reason (Shown in-game)</label>
        <input type="text" id="reason" name="reason" required placeholder="e.g. Speed Hacking">

        <label for="doing">What were you doing before you got banned?</label>
        <textarea id="doing" name="doing" required placeholder="e.g. Mining at y:12, pvping at spawn..."></textarea>

        <label for="explanation">Why should you be unbanned?</label>
        <textarea id="explanation" name="explanation" required placeholder="Explain why this was a false-positive..."></textarea>

        <button type="submit">Submit Appeal</button>
    </form>
</div>

</body>
</html>
