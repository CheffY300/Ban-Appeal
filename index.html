<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Ban Appeal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .appeal-container {
            background-color: #2a2a2a;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 500px;
        }
        h2 {
            text-align: center;
            color: #ff4d4d;
            margin-top: 0;
        }
        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
            color: #cccccc;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #444;
            border-radius: 4px;
            background-color: #333;
            color: #fff;
            box-sizing: border-box;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #ff4d4d;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background-color: #ff4d4d;
            border: none;
            border-radius: 4px;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #e63939;
        }
    </style>
</head>
<body>

<div class="appeal-container">
    <h2>Minecraft Ban Appeal</h2>
    <form action="https://formspree.io/f/mgaeojda" method="POST">
        <label for="username">Minecraft Username</label>
        <input type="text" id="username" name="username" placeholder="e.g. CheffY300" required>

        <label for="caseid">Case ID (Shown on your ban screen)</label>
        <input type="text" id="caseid" name="caseid" placeholder="e.g. A89F2" required>

        <label for="reason">Ban Reason</label>
        <input type="text" id="reason" name="reason" placeholder="e.g. Speed Hacking / Illegal Movement" required>

        <label for="explanation">Why should you be unbanned?</label>
        <textarea id="explanation" name="explanation" rows="5" placeholder="Explain what happened..." required></textarea>

        <button type="submit">Submit Appeal</button>
    </form>
</div>

</body>
</html>
